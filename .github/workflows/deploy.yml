name: DEPLOY
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: rsync deployments
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete --exclude=.git --exclude=.github --exclude=.gitattributes --exclude=.gitignore --exclude=.editorconfig --exclude=node_modules --exclude=tests --exclude=package.json --exclude=package-lock.json --exclude=webpack.common.js --exclude=webpack.config.dev.js --exclude=webpack.config.prod.js --exclude=LICENSE.txt
          path: .
          remote_path: ${{ secrets.PATH }} # ex: /var/www/html/
          remote_host: ${{ secrets.HOST }} # ex: example.com
          remote_user: ${{ secrets.USERNAME }} # ex: ubuntu
          remote_key: ${{ secrets.SSH_KEY }}
